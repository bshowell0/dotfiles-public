# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking
#
# Updated for AeroSpace v0.21.3-Beta

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands

# With borders
after-startup-command = [
  'exec-and-forget borders style=round hidpi=on ax_focus=on active_color=0x88ffffff inactive_color=0x00000000 width=10.0',
  'exec-and-forget sketchybar'
]
# Without borders
# after-startup-command = [
#   'exec-and-forget sketchybar'
# ]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Notify Sketchybar about binding mode change.
# Replaces the per-binding 'exec-and-forget sketchybar --trigger ...' calls that
# used to be duplicated across every mode.service binding.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
on-mode-changed = [
  'exec-and-forget sketchybar --trigger aerospace_mode_change AEROSPACE_MODE=$(aerospace list-modes --current)'
]

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = false

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 80

# Possible values: tiles|accordion
default-root-container-layout = 'accordion'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# Deliberately empty: empty workspaces are destroyed on the fly, so
# 'aerospace list-workspaces' is the single source of truth for the Sketchybar
# scripts. Note that under config-version = 1 this list was implicitly inferred
# from the right-hand side of the keyboard bindings below.
persistent-workspaces = []

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Do the same on every workspace change
on-focus-changed = ['move-mouse window-lazy-center']

# NB! This is the inverse of the two callbacks above. Don't enable it alongside
# them - "mouse follows focus" and "focus follows mouse" will fight each other.
focus-follows-mouse.enabled = false

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'



# `aerospace list-apps` to get app ids of running applications
# Modern syntax: inline tables with 'if = test ...'. The old 'if.app-id' form is
# soft deprecated (still supported indefinitely).
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
on-window-detected = [
    # Float
    { if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.valvesoftware.steam || test %{app-bundle-id} = com.1password.1password || test %{app-bundle-id} = com.apple.FaceTime', run = 'layout floating' },

    # A - chat / music
    { if = 'test %{app-bundle-id} = com.spotify.client || test %{app-bundle-id} = com.apple.MobileSMS', run = 'move-node-to-workspace A' },

    # B - browsers
    { if = 'test %{app-bundle-id} = app.zen-browser.zen || test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace B' },

    # C - editors / IDEs
    { if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92 || test %{app-bundle-id} = com.google.android.studio || test %{app-bundle-id} = com.microsoft.VSCode || test %{app-bundle-id} = com.openai.codex', run = 'move-node-to-workspace C' },

    # D - team chat
    { if = 'test %{app-bundle-id} = com.hnc.Discord || test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace D' },

    # V - terminals
    { if = 'test %{app-bundle-id} = com.googlecode.iterm2 || test %{app-bundle-id} = com.mitchellh.ghostty || test %{app-bundle-id} = com.superlogical.rex', run = 'move-node-to-workspace V' },

    # X - local models
    { if = 'test %{app-bundle-id} = ai.elementlabs.lmstudio', run = 'move-node-to-workspace X' },
]

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    # # no outer gaps (without borders)
    # inner.horizontal = 0
    # inner.vertical =   0
    # outer.left =       0
    # outer.bottom =     0
    # # main monitor with notch, gap of 5; other monitors, gap of 32 for sketchybar
    # outer.top = [{ monitor."Built-in Retina Display" = 0 }, 32]
    # outer.right =      0
    # no outer gaps (with borders)
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       5
    outer.bottom =     5
    # main monitor with notch, gap of 5; other monitors, gap of 32 for sketchybar + 5 for border
    outer.top = [{ monitor."Built-in Retina Display" = 5 }, 37]
    outer.right =      5
    # # yes outer gaps (with borders)
    # inner.horizontal = 10
    # inner.vertical =   10
    # outer.left =       15
    # outer.bottom =     15
    # # main monitor with notch, gap of 5; other monitors, gap of 32 for sketchybar + 15 for border
    # outer.top = [{ monitor."Built-in Retina Display" = 15 }, 47]
    # outer.right =      15

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-ctrl-cmd-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-ctrl-cmd-slash = 'layout tiles horizontal vertical'
    alt-ctrl-cmd-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-ctrl-cmd-h = 'focus left'
    alt-ctrl-cmd-j = 'focus down'
    alt-ctrl-cmd-k = 'focus up'
    alt-ctrl-cmd-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-ctrl-cmd-h = 'move left'
    alt-shift-ctrl-cmd-j = 'move down'
    alt-shift-ctrl-cmd-k = 'move up'
    alt-shift-ctrl-cmd-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-ctrl-cmd-minus = 'resize smart -50'
    alt-ctrl-cmd-equal = 'resize smart +50'

    # Screenshots
    alt-ctrl-cmd-3 = 'exec-and-forget screencapture -c'
    alt-ctrl-cmd-4 = 'exec-and-forget screencapture -i -c'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-ctrl-cmd-1 = 'workspace 1'
    alt-ctrl-cmd-2 = 'workspace 2'
    alt-ctrl-cmd-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
    alt-ctrl-cmd-b = 'workspace B'
    alt-ctrl-cmd-c = 'workspace C'
    alt-ctrl-cmd-d = 'workspace D'
    alt-ctrl-cmd-e = 'workspace E'
    alt-ctrl-cmd-f = 'workspace F'
    alt-ctrl-cmd-g = 'workspace G'
    alt-ctrl-cmd-i = 'workspace I'
    alt-ctrl-cmd-m = 'workspace M'
    alt-ctrl-cmd-n = 'workspace N'
    alt-ctrl-cmd-o = 'workspace O'
    alt-ctrl-cmd-p = 'workspace P'
    alt-ctrl-cmd-q = 'workspace Q'
    alt-ctrl-cmd-r = 'workspace R'
    alt-ctrl-cmd-s = 'workspace S'
    alt-ctrl-cmd-t = 'workspace T'
    alt-ctrl-cmd-u = 'workspace U'
    alt-ctrl-cmd-v = 'workspace V'
    alt-ctrl-cmd-w = 'workspace W'
    alt-ctrl-cmd-x = 'workspace X'
    alt-ctrl-cmd-y = 'workspace Y'
    alt-ctrl-cmd-z = 'workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-ctrl-cmd-1 = 'move-node-to-workspace 1'
    alt-shift-ctrl-cmd-2 = 'move-node-to-workspace 2'
    alt-shift-ctrl-cmd-a = 'move-node-to-workspace A'
    alt-shift-ctrl-cmd-b = 'move-node-to-workspace B'
    alt-shift-ctrl-cmd-c = 'move-node-to-workspace C'
    alt-shift-ctrl-cmd-d = 'move-node-to-workspace D'
    alt-shift-ctrl-cmd-e = 'move-node-to-workspace E'
    alt-shift-ctrl-cmd-f = 'move-node-to-workspace F'
    alt-shift-ctrl-cmd-g = 'move-node-to-workspace G'
    alt-shift-ctrl-cmd-i = 'move-node-to-workspace I'
    alt-shift-ctrl-cmd-m = 'move-node-to-workspace M'
    alt-shift-ctrl-cmd-n = 'move-node-to-workspace N'
    alt-shift-ctrl-cmd-o = 'move-node-to-workspace O'
    alt-shift-ctrl-cmd-p = 'move-node-to-workspace P'
    alt-shift-ctrl-cmd-q = 'move-node-to-workspace Q'
    alt-shift-ctrl-cmd-r = 'move-node-to-workspace R'
    alt-shift-ctrl-cmd-s = 'move-node-to-workspace S'
    alt-shift-ctrl-cmd-t = 'move-node-to-workspace T'
    alt-shift-ctrl-cmd-u = 'move-node-to-workspace U'
    alt-shift-ctrl-cmd-v = 'move-node-to-workspace V'
    alt-shift-ctrl-cmd-w = 'move-node-to-workspace W'
    alt-shift-ctrl-cmd-x = 'move-node-to-workspace X'
    alt-shift-ctrl-cmd-y = 'move-node-to-workspace Y'
    alt-shift-ctrl-cmd-z = 'move-node-to-workspace Z'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-ctrl-cmd-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-ctrl-cmd-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-ctrl-cmd-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# Sketchybar is notified via the 'on-mode-changed' callback above, so these
# bindings no longer need to trigger it themselves.
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    alt-ctrl-cmd-r = ['flatten-workspace-tree', 'mode main'] # reset layout
    alt-ctrl-cmd-f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    alt-ctrl-cmd-backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-ctrl-cmd-h = ['join-with left', 'mode main']
    alt-ctrl-cmd-j = ['join-with down', 'mode main']
    alt-ctrl-cmd-k = ['join-with up', 'mode main']
    alt-ctrl-cmd-l = ['join-with right', 'mode main']

    # down = 'volume down'
    # up = 'volume up'
    # shift-down = ['volume set 0', 'mode main']
