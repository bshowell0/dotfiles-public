# # ── REMOTE MACHINES ONLY ──────────────────────────────────────────────────────
# # Uncomment on machines primarily used through ssh: C-a as prefix so it doesn't
# # collide with the local tmux's C-b. This is the only per-machine block --
# # everything below stays active on both.
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix
# # ──────────────────────────────────────────────────────────────────────────────

# Enable vim navigation between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable Vim keybindings in copy mode
setw -g mode-keys vi

# Allow clipboard to function between local and remote sessions
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# This keeps old builds of tmux consistent with tmux 3.5+
set -sg escape-time 10

# Start panes at 1 for easier jumping
set-option -g base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Move status bar to top
set -g status-position top

# Make the status line not-ugly
set -g status-style "bg=default,fg=colour42"

# Bold the current window
setw -g window-status-current-style "fg=colour48,bold"

# Make the active pane obvious: dim inactive borders, bright green active border.
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour48,bold"

# Arrow on the border pointing at the active pane.
set -g pane-border-indicators arrows

# Change what's displayed in the status line
set -g status-left-length 20
set -g status-left  " #[bold][#S] "
# set -gu status-left
# set -g status-right " %Y-%m-%d %H:%M "
# set -gu status-right
