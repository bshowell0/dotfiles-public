# Set prefix to Ctrl-a instead of default Ctrl-b for machines primarily used through ssh
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Enable vim navigation between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable Vim keybindings in copy mode
setw -g mode-keys vi

# Start panes at 1 for easier jumping
set-option -g base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Move status bar to top
set -g status-position top

# Make the status line not-ugly
set -g status-style "bg=default,fg=colour42"

# Bold the current window
setw -g window-status-current-style "fg=colour48,bold"

# Change what's displayed in the status line
set -g status-left-length 20
set -g status-left  " #[bold][#S] "
